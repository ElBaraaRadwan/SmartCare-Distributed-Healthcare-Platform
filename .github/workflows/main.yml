name: SmartCare CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

env:
  NODE_VERSION: "18"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: smartcare

jobs:
  # ============================================
  # STAGE 1: Lint & Format Check
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: |
          npm ci --workspace=packages/common
          npm ci --workspace=apps/api-gateway
          npm ci --workspace=apps/frontend
          npm ci --workspace=services/auth-service
          npm ci --workspace=services/clinic-service

      - name: Build common package
        run: npm run build --workspace=packages/common

      - name: Run ESLint
        run: npm run lint --workspaces --if-present

  # ============================================
  # STAGE 2: Unit Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartcare_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install and build common package
        run: |
          npm ci --workspace=packages/common
          npm run build --workspace=packages/common

      - name: Install service dependencies
        run: |
          npm ci --workspace=services/auth-service
          npm ci --workspace=services/clinic-service
          npm ci --workspace=apps/api-gateway

      - name: Run auth-service tests
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartcare_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars
        run: npm run test -- --passWithNoTests

      - name: Run clinic-service tests
        working-directory: services/clinic-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartcare_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
        run: npm run test -- --passWithNoTests

      - name: Run api-gateway tests
        working-directory: apps/api-gateway
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
        run: npm run test -- --passWithNoTests

  # ============================================
  # STAGE 3: Build Applications
  # ============================================
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        app:
          - name: api-gateway
            path: apps/api-gateway
            port: 4000
          - name: frontend
            path: apps/frontend
            port: 3000
          - name: auth-service
            path: services/auth-service
            port: 4001
          - name: clinic-service
            path: services/clinic-service
            port: 4002
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install common package
        run: |
          npm ci --workspace=packages/common
          npm run build --workspace=packages/common

      - name: Install app dependencies
        run: npm ci --workspace=${{ matrix.app.path }}

      - name: Build application
        run: npm run build --workspace=${{ matrix.app.path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app.name }}
          path: ${{ matrix.app.path }}/dist
          retention-days: 1

  # ============================================
  # STAGE 4: Security Scanning
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================
  # STAGE 5: Build & Push Docker Images
  # ============================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: ./apps/api-gateway/Dockerfile
            context: .
            path: apps/api-gateway
          - name: frontend
            dockerfile: ./apps/frontend/Dockerfile
            context: .
            path: apps/frontend
          - name: auth-service
            dockerfile: ./services/auth-service/Dockerfile
            context: .
            path: services/auth-service
          - name: clinic-service
            dockerfile: ./services/clinic-service/Dockerfile
            context: .
            path: services/clinic-service
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production