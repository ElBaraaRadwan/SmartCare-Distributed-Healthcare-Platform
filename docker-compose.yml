version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcare_postgres
    environment:
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartcare_dev
    # ports:  # ❌ REMOVED - no public exposure
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcare_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}  # ✅ Added password requirement
    ports:
      - "6379:6379"  # ✅ Exposed for host development services
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]  # ✅ Updated with password
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: smartcare_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
